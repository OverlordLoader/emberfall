name: iOS simulator test build
on:
  pull_request:
    paths:
      - "**/*.swift"
      - "Emberfall.xcodeproj/**"
      - "**/*.plist"
      - "**/*.xcassets/**"
      - "scripts/simulator-smoke.py"
      - ".github/workflows/ios-simulator.yml"
permissions:
  contents: read
concurrency:
  group: ios-simulator-${{ github.repository }}
  cancel-in-progress: false
jobs:
  simulator:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and launch the actual game without signing
        run: python3 scripts/simulator-smoke.py
      - name: Preserve simulator app, startup screenshot and build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emberfall-simulator-${{ github.event.pull_request.head.sha }}
          path: simulator-output/
          retention-days: 7
          if-no-files-found: error
